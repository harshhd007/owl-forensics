name: Refresh live forensic and cybersecurity jobs

on:
  schedule:
    - cron: '30 3 * * *' # 9:00 AM India Standard Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
      - name: Build fresh jobs feed
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python scripts/fetch_jobs.py
      - name: Publish feed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs-feed.json
          if git diff --cached --quiet; then
            echo "The published feed is already current."
          else
            git commit -m "Refresh live India security jobs"
            git push
          fi
